name: 🧪 Tests

# Build + lint + unit tests, split by language into two parallel jobs (PHP / JS)
# so a failure points straight at the language and the two don't block each
# other. Runs on every PR into main (and pushes to main so the badge tracks
# trunk).
#
# NOTE: the app is in its FIRST SLICE — lib/ and tests/unit/ exist; src/ (the JS
# frontend) does not yet. The guards below skip cleanly for what's still absent (see
# AGENTS.md). Both jobs below guard each step on the relevant directory/file
# existing, so they pass cleanly today (there is nothing to lint/build/test yet)
# and start exercising real code automatically once lib/ and src/ land, with no
# workflow changes required.

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read
  # The test reporter publishes a sticky PR comment + a check run with inline
  # annotations on failing tests. Harmless no-ops on push-to-main (no PR), where
  # the same results still render in the job summary.
  checks: write
  pull-requests: write

jobs:

  php:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    # Guarded so the step stays valid as directories arrive slice by slice.
    - name: Lint PHP (php -l)
      run: |
        if [[ -d lib ]]; then
          find lib -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
        else
          echo "No lib/ yet — nothing to lint (see AGENTS.md)."
        fi

    # tests/phpunit.unit.xml doesn't exist yet — skip rather than fail. Once it
    # does, this emits tests/results/junit.xml per that config, same as the
    # sibling apps.
    - name: Unit tests
      run: |
        if [[ -f tests/phpunit.unit.xml ]]; then
          composer run test:unit
        else
          echo "No tests/phpunit.unit.xml yet — nothing to run (see AGENTS.md)."
        fi

    # Keep the raw JUnit report downloadable from the run, when it exists.
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: php-unit-junit
        path: tests/results/junit.xml
        if-no-files-found: ignore

    # Sticky PR comment + check run with inline annotations on failures. Runs
    # even when tests fail so the report is published either way; harmless
    # no-op if the JUnit file doesn't exist yet.
    - name: Publish unit test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: PHP unit test results
        files: tests/results/junit.xml
        comment_mode: always

  js:
    name: JS Build and Test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install JS dependencies
      run: npm ci

    # src/files.js doesn't exist yet — vite.config.js's entry wouldn't resolve.
    # Skip rather than fail until there's something to bundle.
    - name: Build bundle
      run: |
        if [[ -f src/files.js ]]; then
          npm run build
        else
          echo "No src/files.js yet — skipping frontend build (see AGENTS.md)."
        fi

    # Pure-logic unit tests (Vitest). `test` runs with --passWithNoTests (see
    # package.json), so this is green with nothing under tests/js/ yet.
    - name: Unit tests
      run: npm test

    - name: Summarize build
      if: always()
      run: |
        {
          echo "## JS bundle build"
          echo ""
          if [ -f dist/penpot_sync-files.js ]; then
            size=$(du -h dist/penpot_sync-files.js | cut -f1)
            echo "✅ Built \`dist/penpot_sync-files.js\` (${size})"
          else
            echo "ℹ️ No src/files.js yet — nothing built (see AGENTS.md)."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload built bundle
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: js-bundle
        path: dist/penpot_sync-files.js
        if-no-files-found: ignore
