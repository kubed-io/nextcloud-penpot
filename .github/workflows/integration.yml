name: 🔗 Integration

# Integration tests — prove the real wiring the unit suite mocks out, on a live
# Nextcloud (+ a live Penpot, once anything actually talks to it). Framework:
# **Behat**, the Nextcloud-native integration framework, run from
# tests/integration/, mirroring kubed-io/nextcloud-grafana and
# kubed-io/nextcloud-n8n. Behat's BUILT-IN junit formatter emits JUnit XML, which
# the same EnricoMi reporter the unit suite uses turns into a sticky PR comment.
#
# SCOPE RIGHT NOW: app install/enable, the base URL over occ, and — new with the
# client — a REAL connection to a REAL Penpot. Every other feature file stays
# @todo and is filtered out by behat.dist.yml.
#
# WHY THE PENPOT STACK IS WORTH THREE CONTAINERS PER RUN. This suite is the ONLY
# place the wire format is asserted. The unit suite deliberately does not mock
# the transport: Penpot speaks Transit over an RPC bus, and a mock of a protocol
# we have repeatedly misread would only encode the misreading. That is not
# hypothetical — the client shipped three bugs that no hand-written fixture would
# have caught (two Transit cache-tracking bugs, and `json_encode([])` producing
# `[]` where Penpot's handler demands `{}` and 500s otherwise). All three were
# found by calling a live instance.
#
# NO REPOSITORY SECRET IS NEEDED (saga §6.47). Penpot can mint a token headlessly:
#   prepare-register-profile → register-profile → login-with-password
#     → create-access-token
# so each run creates its own isolated account. The chain runs in the "Mint
# Penpot token" step below.

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/integration.yml
    - appinfo/**
    - lib/**
    - templates/**
    - features/**
    - tests/integration/**
    - composer.json
  push:
    branches:
    - main
    paths:
    - .github/workflows/integration.yml
    - appinfo/**
    - lib/**
    - templates/**
    - features/**
    - tests/integration/**
    - composer.json

permissions:
  contents: read
  # Behat results → sticky PR comment + check run (EnricoMi), like the unit suite.
  checks: write
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Static values here so `run:` steps are pure bash reading $VARS — never inline
# GitHub templating (see CONTRIBUTING.md "Workflow authoring conventions").
env:
  APP_ID: penpot_sync
  NC_ADMIN_USER: admin
  NC_ADMIN_PASS: admin

jobs:

  integration:
    name: Integration ${{ matrix.suite }}
    runs-on: ubuntu-latest

    # ── TWO AXES, AND THEY DO OPPOSITE THINGS ────────────────────────────────
    #
    #   suite    DIVIDES the scenarios. Four legs each run a quarter, in
    #            parallel, so wall time drops.
    #   backend  REPEATS them. Every behaviour is valid on both storage backends
    #            (features/README.md has said so for a while), so this is a
    #            dimension the suite is RUN across rather than written twice.
    #
    # Net effect measured on this repo: ~95s fixed setup + ~320s Behat, so one
    # leg is ~7m and four are ~95+80 = ~3m — while the backend axis doubles
    # coverage at no wall-clock cost, because those legs run in parallel too.
    #
    # WHY THE SUITE AXIS IS FILENAME-BASED, not tag-based: measured over the live
    # scenarios, 28 carry no channel tag and 32 no origin tag, so a tag partition
    # LEAKS — those scenarios would match no leg and silently stop running, and
    # every leg would still be green. `bin/check-suites.sh` (quality workflow)
    # enforces that features/ is partitioned exactly.
    #
    # fail-fast: false is load-bearing. With it on, one flaky leg cancels the
    # others and you lose the signal from the legs that were fine.
    strategy:
      fail-fast: false
      matrix:
        # NC 33 is the app's max-version; SQLite is the fast integration path.
        server-versions: ['stable33']
        suite: [admin, design, project, core]
        # (no exclusions: one leg per suite)

    services:
      # ── Penpot stack ──────────────────────────────────────────────────────
      # Penpot needs postgres + valkey alongside the backend, which is why this
      # is heavier than Grafana's single container. The FLAGS are load-bearing
      # for the token mint step below:
      #   enable-access-tokens       — create-access-token is gated behind it
      #   disable-email-verification — else registration waits on an email
      # and it must NOT carry disable-registration / disable-login-with-password.
      # (Our own production instance sets those because it's OIDC/LDAP-gated,
      # which is exactly why the mint cannot be run against it.)
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: penpot
          POSTGRES_USER: penpot
          POSTGRES_PASSWORD: penpot
        options: >-
          --health-cmd "pg_isready -U penpot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      penpot:
        image: penpotapp/backend:2.17.0
        ports:
        - 6060:6060
        env:
          PENPOT_FLAGS: enable-access-tokens disable-email-verification disable-onboarding disable-secure-session-cookies
          PENPOT_DATABASE_URI: postgresql://postgres/penpot
          PENPOT_DATABASE_USERNAME: penpot
          PENPOT_DATABASE_PASSWORD: penpot
          PENPOT_REDIS_URI: redis://valkey/0
          # The PUBLIC uri is the FRONTEND, because that is the address the app —
          # and every browser — actually talks to. See the frontend service below.
          PENPOT_PUBLIC_URI: http://localhost:9001
          # Named explicitly rather than left to the default, because the frontend
          # has to be told the same path and a silent default drift between the
          # two images would be a 404 with no obvious cause.
          PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
        # The exported archive is written here by the backend and READ BACK OFF
        # DISK BY NGINX (see the frontend service). One volume, both containers,
        # exactly as Penpot's own compose file does it — a named volume rather
        # than a bind mount so Docker seeds it with the image's own ownership
        # (uid 1001) instead of a root-owned empty host directory.
        volumes:
        - penpot_assets:/opt/data/assets
      # THE FRONTEND IS NOT OPTIONAL, and finding that out cost a red build.
      #
      # Penpot's backend does not serve exported files. It authenticates the
      # `/assets/by-id/<uuid>` request and then answers **with no body** plus a
      # redirect header for nginx to act on. So a suite that talks to the backend
      # alone sees every export "succeed" and download zero bytes — which is
      # precisely the failure `exportBinfile`'s ZIP-magic check exists to catch,
      # and precisely the misconfiguration a user could hit.
      #
      # Running the real two-container topology is what makes the integration
      # suite's claim ("a promotion stores a real archive") mean anything.
      #
      # HOW THE HANDOFF ACTUALLY WORKS, since it is not a plain proxy: with the
      # `fs` object storage these images default to, the backend answers 204 with
      # an `x-accel-redirect` naming a path under `/opt/data/assets`. Nginx then
      # serves that file FROM ITS OWN FILESYSTEM. So the two containers must
      # share the assets volume or every download 404s — the frontend would be
      # looking for a file only the backend has.
      #
      # (With `s3` storage the backend answers 307 + `location` instead and nginx
      # follows the signed URL, needing no shared volume. Either way nginx adds
      # its own `x-internal-redirect` echo — which is why the client checks for
      # both names and not just the one our production instance happens to show.)
      penpot-frontend:
        image: penpotapp/frontend:2.17.0
        ports:
        - 9001:8080
        env:
          PENPOT_FLAGS: enable-access-tokens disable-email-verification disable-onboarding disable-secure-session-cookies
          PENPOT_BACKEND_URI: http://penpot:6060
          PENPOT_EXPORTER_URI: http://penpot:6061
        volumes:
        - penpot_assets:/opt/data/assets

    steps:
    # ── Provision: install everything up front, before any action runs ───────
    - name: Checkout server
      uses: actions/checkout@v7
      with:
        repository: nextcloud/server
        ref: ${{ matrix.server-versions }}
        submodules: true

    - name: Checkout app into apps/
      uses: actions/checkout@v7
      with:
        path: apps/${{ env.APP_ID }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        # Match the production pod / the rest of our CI.
        php-version: '8.4'
        extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, curl, xml
        coverage: none
        tools: composer:v2

    - name: Install Behat deps
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      run: composer install --prefer-dist --no-progress

    - name: Install Nextcloud (SQLite)
      run: |
        mkdir -p data
        ./occ maintenance:install \
          --database=sqlite \
          --admin-user="$NC_ADMIN_USER" \
          --admin-pass="$NC_ADMIN_PASS"
        ./occ config:system:set trusted_domains 1 --value=localhost
        # The gesture channel (copy/move/rename) reaches NC over HTTP at
        # localhost:8080, so that host:port must be trusted too. Same arrangement
        # as nextcloud-n8n, whose suite this one is catching up with.
        ./occ config:system:set trusted_domains 2 --value=localhost:8080
        # Nextcloud's SSRF guard refuses outbound requests to local addresses,
        # so the app cannot reach the Penpot service container at localhost:9001
        # without this. The client reports it precisely — "Host localhost
        # violates local access rules" — which is how this was diagnosed.
        #
        # This mirrors real deployments rather than being a CI-only hack: a
        # homelab reaches Penpot at an in-cluster address (saga §6.17 hit the
        # same gate on the live instance), so the same setting is needed there.
        ./occ config:system:set allow_local_remote_servers --value=true --type=boolean
        # INFO, not the default WARN. Every listener in this app logs its outcome
        # and swallows its failures by design, so at WARN a run that did the wrong
        # thing successfully leaves no trace at all — which is exactly the state a
        # prune of one unexpected mirror left this suite in: a count in the CLI
        # summary, and nothing anywhere naming the file. The failure-path log dump
        # below is only as useful as the level allows.
        ./occ config:system:set loglevel --value=1 --type=integer

    # ── Serve: the occ-only scenarios need no HTTP, but copy/move/rename do.
    # Those three are driven by events Nextcloud emits from its Files API, and
    # nothing in `occ` performs a file-manager gesture — which is why
    # copy/move/rename-*.feature sat @todo while the code they describe shipped
    # untested against a real Penpot. WebDAV is how a browser does it, and PHP's
    # built-in server is enough for DAV: no nginx, no fpm. Ported from
    # nextcloud-n8n, where this has been carrying a much deeper suite.
    # ── TEAM FOLDERS ARE ALWAYS PRESENT ──────────────────────────────────────
    # A "team folder" is the groupfolders app, and it is installed on EVERY leg —
    # the same thing the n8n and grafana suites do.
    #
    # It used to be a matrix axis: `plain` legs ran without it, `team` legs with,
    # and every suite ran twice. That made the storage backend something the RUN
    # decided and the spec could not mention, so a mapping table could not say
    # which kind of folder it wanted, and scenarios needed @plain-folder /
    # @team-folder tags to opt out of the leg that could not host them.
    #
    # With the app always present, `| storage | team folder |` is just another
    # cell — the mapping says what it is, which is where that belongs, and the
    # nuances between the two become askable in one run instead of being split
    # across legs that never meet.
    - name: Install Team Folders (groupfolders)
      run: |
        ./occ app:install groupfolders
        ./occ app:enable groupfolders
        ./occ app:list | grep -i groupfolders

    - name: Start Nextcloud (php built-in server)
      run: |
        php -S localhost:8080 -t "$GITHUB_WORKSPACE" >/tmp/nc-web.log 2>&1 &
        echo "NC_WEB_PID=$!" >> "$GITHUB_ENV"
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null "$NC_BASE_URL/status.php"; then echo "NC web up"; exit 0; fi
          sleep 2
        done
        echo "NC web server did not come up" >&2; cat /tmp/nc-web.log >&2; exit 1
      env:
        NC_BASE_URL: http://localhost:8080

    # ── Act: everything provisioned — now do the work ────────────────────────
    # Penpot's backend runs migrations on first boot, so the container is
    # "started" well before the RPC bus answers.
    #
    # WE POLL THE RPC BUS, NOT A HEALTH ENDPOINT. Two reasons, both checked
    # against a live Penpot rather than assumed:
    #   - `/api/health` does not exist (404). `/readyz` does answer 200, but it
    #     reports the process, not the API.
    #   - The RPC bus is what the very next step actually needs, and it is the
    #     last thing to come up. A readiness check that greens before the thing
    #     you depend on is ready is worse than no check, because it converts a
    #     clear "not ready" into a confusing failure one step later.
    # `get-profile` unauthenticated answers 200 with the anonymous profile, so a
    # 200 here means the bus is genuinely serving commands.
    #
    # github-script rather than bash: a real deadline that a slow response
    # cannot overrun (bash's `sleep 1` loop drifts by the request duration), and
    # errors while the container is still booting are caught rather than
    # tripping `set -e`.
    #
    # POLLED THROUGH THE FRONTEND, so one gate covers the whole topology: nginx
    # proxies `/api` to the backend, so a 200 here means both containers are up
    # and talking — and it is the exact path the app will use.
    - name: Wait for Penpot
      uses: actions/github-script@v9
      env:
        PENPOT_URL: http://localhost:9001
      with:
        script: |
          const url = `${process.env.PENPOT_URL}/api/rpc/command/get-profile`;
          const started = Date.now();
          const deadline = started + 180_000;
          let attempts = 0;

          while (Date.now() < deadline) {
            attempts++;
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
              });
              if (res.ok) {
                const elapsed = ((Date.now() - started) / 1000).toFixed(1);
                core.info(`Penpot RPC is serving after ${elapsed}s (${attempts} attempt(s))`);
                return;
              }
            } catch {
              // Connection refused while the backend is still migrating.
            }
            await new Promise(r => setTimeout(r, 2000));
          }

          const elapsed = ((Date.now() - started) / 1000).toFixed(1);
          core.setFailed(`Penpot did not answer ${url} within ${elapsed}s (${attempts} attempts)`);

    # PREREQUISITE: mint a token so scenarios can act as "a user who already has
    # one". How a token gets created is out of the app's scope — this is pure
    # test setup, and needs no secret (saga §6.47).
    #
    # Four chained calls, each reading the previous response to build the next:
    #   prepare-register-profile -> register-profile -> login-with-password
    #     -> create-access-token
    # That is exactly the shape the workflow instructions say not to do in bash.
    # The shell version parsed JSON with `sed -n 's/.*"token":"\([^"]*\)".*/\1/p'`,
    # which returns empty rather than failing the moment a value is nested or
    # contains a quote — and it hand-rolled a cookie jar for the session step.
    - name: Mint Penpot token (prerequisite)
      id: penpot_token
      uses: actions/github-script@v9
      env:
        PENPOT_URL: http://localhost:9001
      with:
        script: |
          const base = `${process.env.PENPOT_URL}/api/rpc/command`;
          // Unique per run so repeated CI runs never collide on an existing account.
          const email = `ci-${Date.now()}@example.test`;
          const password = 'Integration-Tests-1';

          // Penpot speaks Transit by default; ask for plain JSON explicitly.
          // Safe HERE (unlike in PenpotClient) because this script reads the
          // response itself and never hands it to the Transit decoder.
          const call = async (command, body, cookie) => {
            const res = await fetch(`${base}/${command}`, {
              method: 'POST',
              headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                ...(cookie ? { Cookie: cookie } : {}),
              },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              throw new Error(`${command} failed: HTTP ${res.status} ${await res.text()}`);
            }
            return { json: await res.json(), setCookie: res.headers.get('set-cookie') };
          };

          const prepared = await call('prepare-register-profile', {
            fullname: 'CI Integration', email, password,
          });
          if (!prepared.json.token) {
            core.setFailed('prepare-register-profile returned no token — is registration disabled?');
            return;
          }

          await call('register-profile', { token: prepared.json.token });

          const login = await call('login-with-password', { email, password });
          if (!login.setCookie) {
            core.setFailed('login-with-password returned no session cookie');
            return;
          }

          const created = await call(
            'create-access-token',
            { name: 'integration-tests' },
            login.setCookie.split(';')[0],
          );
          if (!created.json.token) {
            core.setFailed("create-access-token returned no token — is 'enable-access-tokens' set in PENPOT_FLAGS?");
            return;
          }

          core.setSecret(created.json.token);
          core.setOutput('token', created.json.token);
          core.info(`Penpot access token obtained (length ${created.json.token.length})`);

    # Behat runs from the integration dir; OCC points back at the server root so
    # `occ` resolves. Formatters (pretty → stdout, junit → junit/) are configured
    # in behat.dist.yml, so no --format flags are needed here.
    #
    # --strict: an UNDEFINED step must fail the job. Behat's default is to exit 0
    # on undefined steps, so a scenario whose step definitions do not exist is
    # reported as "undefined" and the run still succeeds — the job goes green and
    # only the JUnit reporter's check goes red, pointing at no scenario in
    # particular. That happened here: a stray `@todo` tag bound to the following
    # scenario instead of the comment block it appeared to head, silently
    # excluding one scenario and leaving four running undefined. With ~@todo
    # filtering, an undefined step means a scenario was left untagged, which is
    # always a mistake worth failing on.
    - name: Run Behat
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      env:
        OCC: php ${{ github.workspace }}/occ
        NC_BASE_URL: http://localhost:8080
        NC_ADMIN_USER: ${{ env.NC_ADMIN_USER }}
        NC_ADMIN_PASS: ${{ env.NC_ADMIN_PASS }}
        PENPOT_URL: http://localhost:9001
        PENPOT_TOKEN: ${{ steps.penpot_token.outputs.token }}
        # Bound here rather than interpolated into `run:` — a `${{ }}` inside a
        # shell script is substituted BEFORE the shell sees it, which mixes
        # templating with logic and is an injection seam. Read as plain $VARs.
        SUITE: ${{ matrix.suite }}
      # The status filter is repeated from behat.dist.yml because a CLI --tags
      # REPLACES the config filter rather than adding to it. bin/check-suites.sh
      # asserts the two lists are identical, so they cannot drift apart silently.
      run: |
        vendor/bin/behat --config behat.dist.yml --strict \
          --suite="$SUITE" \
          --tags="~@todo&&~@unbuilt&&~@blocked&&~@decision"

    # ── Diagnostics: what did the SERVER think? ──────────────────────────────
    # A failing Behat scenario reports what the ASSERTION saw and nothing about
    # why. Every listener in this app logs its own failures and swallows them by
    # design (a remote problem must never break a file operation), so the reason
    # is in nextcloud.log and was, until now, thrown away with the runner.
    - name: Nextcloud log (on failure)
      if: failure()
      run: |
        echo "── penpot_sync lines ──"
        grep -a '"app":"penpot_sync"' data/nextcloud.log 2>/dev/null | tail -80 || echo "(none)"
        echo "── last 30 lines, any app ──"
        tail -30 data/nextcloud.log 2>/dev/null || echo "(no log)"
      working-directory: ${{ github.workspace }}

    # ONE RESULT FOR THE WHOLE RUN, NOT SEVEN. Each leg only UPLOADS its JUnit
    # XML; the publish job below collects them and reports once. Publishing per
    # leg produced seven checks and seven PR comment updates for one test run,
    # which buries the answer to "did the suite pass?" under the mechanics of how
    # it was split.
    #
    # `if: always()` so a failing leg still contributes its results — a leg that
    # fails is exactly the one whose report you want.
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # Unique per leg: artifacts with the same name collide.
        name: junit-${{ matrix.suite }}
        path: apps/${{ env.APP_ID }}/tests/integration/junit/*.xml
        retention-days: 7
        if-no-files-found: error

  # ── one report for the whole matrix ────────────────────────────────────────
  # This is the action's own documented matrix pattern, and it needs NO XML
  # merging: `files` is a glob and the action aggregates across every file it
  # matches. It also distinguishes TESTS from RUNS, which is exactly right here —
  # a scenario run on both backends is one test with two runs, not two tests.
  publish-integration-results:
    name: Integration results
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    # NO `merge-multiple`, AND THAT IS THE WHOLE FIX.
    #
    # Behat names its report after the SUITE, not the leg — every leg writes
    # `<suite>.xml`. `merge-multiple: true` flattens all seven artifacts into one
    # directory, so `design/plain` and `design/team` both land on `design.xml` and
    # the second download silently overwrites the first. Measured on the run that
    # introduced this job: 7 artifacts in, 4 files out, 173 tests reported as 97.
    #
    # Worse than losing half the results, WHICH half is download-order dependent.
    # That run reported `97 tests, 97 passed, 0 failed` while `design / team` was
    # red — a green report over a red matrix, which is the one failure mode a
    # reporter must never have.
    #
    # Left off, each artifact lands in `junit/<artifact-name>/`, the names are
    # unique by construction, and the glob below picks up all seven.
    - name: Download every leg's results
      uses: actions/download-artifact@v8
      with:
        path: junit
        pattern: junit-*

    # The guard, because the failure above was SILENT — the report looked healthy
    # and simply described a different, smaller run. One leg uploads exactly one
    # suite report, so any collision shows up as fewer files than directories.
    - name: Every leg is present
      run: |
        dirs=$(find junit -mindepth 1 -maxdepth 1 -type d | wc -l)
        files=$(find junit -name '*.xml' | wc -l)
        echo "legs: $dirs, reports: $files"
        find junit -name '*.xml' | sort
        if [ "$dirs" -eq 0 ]; then echo "::error::no leg uploaded a report"; exit 1; fi
        if [ "$dirs" -ne "$files" ]; then
          echo "::error::$dirs legs but $files reports — results are being overwritten"
          exit 1
        fi

    - name: Publish integration results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Integration test results
        files: junit/**/*.xml
        comment_mode: always
        # The legs already fail the workflow on a failing scenario; this job
        # exists to REPORT, so it must not turn a reporting hiccup into a second
        # red X for the same failure.
        action_fail: false
