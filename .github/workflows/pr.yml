name: 🔀 PR

# Ensure the PR owner is set and they added to the changelog.

on:
  pull_request:
    branches:
    - main
    # `labeled`/`unlabeled` on top of the defaults (opened, synchronize,
    # reopened), because the changelog check's own escape hatch is a LABEL:
    # it tells you to add "no changelog" for a change that is not user-visible,
    # and without these types adding one re-runs nothing. A re-run does not
    # help either — it replays the stored event payload, so the label is still
    # absent and the job fails again with NO_CHANGELOG_LABEL: false.
    #
    # Found the only way it can be: by hitting it on a spec-only PR that
    # correctly had nothing to put in the changelog.
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled

permissions:
  contents: read
  # Auto-assign needs to write the assignee on the PR.
  pull-requests: write

jobs:

  pr-tasks:
    name: PR Tasks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Assign the PR author to their own PR per .github/assign.yml.
    - name: Auto Assign
      uses: kentaro-m/auto-assign-action@v2.0.2
      with:
        configuration-path: .github/assign.yml

    # Fail the PR if CHANGELOG.md has no new entry under [Unreleased] — the
    # release workflow consumes that section as the release notes, so every PR
    # has to contribute something to it.
    - name: Make sure Changelog is updated
      uses: tarides/changelog-check-action@v3
      with:
        changelog: CHANGELOG.md
