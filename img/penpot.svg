<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPDX-FileCopyrightText: 2026 kubed-io
  SPDX-License-Identifier: AGPL-3.0-or-later

  Filetype icon for application/vnd.penpot (.penpot files).
  RegisterMimetype copies this exact file into core/img/filetypes/penpot.svg,
  where Nextcloud's GenerateMimetypeFileBuilder enumerates it, so it shows on
  every .penpot row in the Files app.

  THE FILL IS HARDCODED ON PURPOSE, and this file is NOT the menu icon.
  Nextcloud renders mimetype icons as-is out of core/img/filetypes/ and never
  recolours them, so a currentColor mark would come out invisible here. The
  context-menu glyph is a separate currentColor file, img/icons/penpot.svg —
  same geometry, opposite treatment. Collapsing the two puts a solid tile in a
  menu row, or an invisible icon in the file list, depending which way you
  collapse them.

  Geometry mirrors img/app.svg (the settings-section mark) at 1.5x — an
  artboard with a rule grid and one placed shape — so the file glyph and the
  app read as one identity.

  Deliberately NOT the Penpot logo, and deliberately not Penpot's brand
  colours: "Penpot" and its logo are trademarks of Kaleidos Ventures SL. This
  is a community integration carrying its own original mark, not affiliated
  with, endorsed by, or sponsored by Penpot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect x="3" y="3" width="18" height="18" rx="2.5" fill="#5b4bd6"/>
  <path d="M3 9h18M9 3v18" stroke="#ffffff" stroke-width="1.1" opacity=".5"/>
  <circle cx="15.5" cy="15.5" r="3" fill="#ffffff"/>
</svg>
