# Behat config for the penpot_sync integration suite.
#
# Behat is the Nextcloud-native integration framework (see nextcloud/deck). It
# drives a *running* Nextcloud (over HTTP / occ) and the Penpot service, and asserts
# both sides — the real wiring the unit suite mocks out (saga §5).
#
# Output: Behat's BUILT-IN junit formatter (no third-party dep) writes JUnit XML
# to junit/, which the integration workflow feeds to the same EnricoMi reporter
# the unit suite uses → sticky PR comment + job summary.
#
# Env the FeatureContext reads (set by the workflow / local runner):
#   NC_BASE_URL, NC_ADMIN_USER, NC_ADMIN_PASS, PENPOT_URL, OCC

default:
  # FOUR STATUS TAGS, AND ONLY ONE OF THEM IS A BACKLOG (features/README.md):
  #
  #   @todo      the code EXISTS; only the test is missing. Pick one up and
  #              write it — `behat --tags @todo` is the work queue.
  #   @unbuilt   a spec awaiting code. Nothing to test yet.
  #   @blocked   real behaviour this harness cannot reach (no browser, no
  #              logged-in session, no fault injection, cannot age a deletion).
  #   @decision  records a deliberate absence. There is no operation, ever.
  #
  # All four are excluded from the run; the distinction is about who picks the
  # scenario up and what they do with it, not about whether it executes today.
  # It used to be one @todo meaning all four at once, which is why "what is
  # actually built but untested?" needed a hand-analysis every time it was asked.
  #
  # 88 OF 114 SCENARIO HEADERS RUN — 176 executed once Examples rows are counted,
  # across eleven legs (admin 31, motion 22, trash 18, copying 17, project-motion
  # 17, projects 14, project-trash 14, project-copy 12, core 11, authoring 10,
  # naming 10). The queue behind that is 17 @todo, 4 @unbuilt, 5 @blocked and
  # no @decision.
  #
  # THESE NUMBERS GO STALE AND THE SAGA IS WHERE THEY BELONG. This block carried a
  # paragraph per round for eight rounds — every one of them true when written and
  # describing a suite that had since moved. They are in
  # saga/Chapter_4_Open_For_Business.md now, which is the only place history lives
  # (AGENTS.md). Recount rather than trust the line above:
  #
  #   behat --dry-run -f progress          # what actually runs
  #   grep -rho '@todo\|@unbuilt\|@blocked\|@decision' ../../features --include='*.feature'
  #
  # THE ONE LESSON WORTH KEEPING IN THE CONFIG: a status tag is a claim somebody
  # made once, and nothing re-checks it. Two scenarios came off the queue in Round 9
  # having been runnable for two rounds; the two that came off in Round 10 were the
  # opposite mistake, tagged @todo over behaviour that did not exist at all, and a
  # @todo in the delete round was the same. `behat --tags @todo` is a QUEUE, not an
  # inventory — read the scenario against the code before believing its tag, and
  # change the tag only on a PR that runs it.
  #
  # THE FILTER NAMES ALL FOUR even though @decision is empty, so re-triage is a tag
  # edit and never a config change. Do not "tidy" the empty one out. What each tag
  # means is unchanged (features/README.md).
  #
  # EVERY LEG REPORTS TESTS NOW. The zero-test exemption in the workflow is no
  # longer load-bearing for any of them — it stays because it self-heals in both
  # directions, and the next spec-first feature file will empty a leg again.
  gherkin:
    filters:
      tags: '~@todo&&~@unbuilt&&~@blocked&&~@decision'

  # FOUR SUITES, AND THEY ARE A PARTITION — every feature file belongs to exactly
  # one. `bin/check-suites.sh` enforces that mechanically, because the failure
  # mode of getting it wrong is SILENT: a file in no suite is simply never run,
  # and a green build says so confidently.
  #
  # Running plain `behat` runs all four in sequence, which is exactly today's
  # coverage — the suites are inert until something selects one. That is
  # deliberate: it lets CI prove the partition covers everything BEFORE the
  # workflow starts depending on it (`behat --suite=admin` per matrix leg).
  #
  # THE AXIS IS THE FILENAME, NOT A TAG. Tags looked like the obvious split and
  # are the wrong tool here: measured over the live scenarios, 28 carry no
  # channel tag and 32 no origin tag, so any tag partition leaks — those
  # scenarios would match no leg and quietly stop running. A path partition
  # cannot leak, because `ls features/*.feature` minus the union must be empty
  # and that is one line to check.
  #
  #   admin    the settings panel and everything reached from it. Grouped because
  #            admin work is a different SESSION from user work, not merely a
  #            different tag — these never interleave with the gesture suites.
  #   design   the six verbs, as they apply to a design (a .penpot file).
  #   project  the same six verbs, as they apply to a project (a folder).
  #   core     everything that is not a verb on one of those two nouns: the pull
  #            itself, identity/membership, modes, and the app lifecycle.
  # ── THE SUITE AXIS IS THE VERB, AND IT IS A PARTITION ────────────────────
  #
  # Eleven legs each run a slice of features/, in parallel, and every feature file
  # belongs to exactly ONE. `bin/check-suites.sh` enforces that mechanically,
  # because both ways of breaking it are SILENT: a file in no suite never runs and
  # every leg still reports green; a file in two runs twice against two stacks.
  #
  # THE AXIS IS THE FILENAME, NOT A TAG. Tags looked like the obvious split and are
  # the wrong tool: measured over the live scenarios, many carry no channel tag and
  # more carry no origin tag, so a tag partition leaks — those scenarios would
  # match no leg and quietly stop running. A path partition cannot, because
  # `ls features/**/*.feature` minus the union must be empty and that is one line
  # to check.
  #
  # WHY ELEVEN AND NOT FOUR. It was four — admin / design / project / core — and
  # the `design` leg grew to ELEVEN MINUTES as its scenarios were promoted, which
  # is the whole wall-clock of a run: the legs are parallel, so the slowest one is
  # the answer. Every leg pays the same fixed cost (a Nextcloud, a Penpot backend,
  # a frontend, Postgres, Valkey), so splitting trades runner minutes for latency —
  # deliberately, and the same trade both siblings already made. Grafana runs
  # thirteen suites on this exact shape; this is its verb axis with penpot's nouns.
  suites:
    admin:
      paths:
      - '%paths.base%/../../features/connection/admin.feature'
      - '%paths.base%/../../features/connection/personal.feature'
      - '%paths.base%/../../features/connection/sync-now.feature'
      - '%paths.base%/../../features/mapping/create.feature'
      - '%paths.base%/../../features/mapping/view.feature'
      - '%paths.base%/../../features/mapping/delete.feature'
      - '%paths.base%/../../features/mapping/manage-groups.feature'
      - '%paths.base%/../../features/mapping/sync-now.feature'
      # Context class lives with the test code (tests/integration/bootstrap/),
      # loaded via the integration composer autoload — features/ stays pure Gherkin.
      contexts: &contexts
      - OCA\PenpotSync\Tests\Integration\FeatureContext

    authoring:
      paths:
      - '%paths.base%/../../features/designs/create.feature'
      - '%paths.base%/../../features/designs/edit.feature'
      contexts: *contexts

    copying:
      paths:
      - '%paths.base%/../../features/designs/copy.feature'
      contexts: *contexts

    naming:
      paths:
      - '%paths.base%/../../features/designs/rename.feature'
      contexts: *contexts

    trash:
      paths:
      - '%paths.base%/../../features/designs/delete.feature'
      - '%paths.base%/../../features/designs/restore.feature'
      - '%paths.base%/../../features/designs/purge.feature'
      contexts: *contexts

    motion:
      paths:
      - '%paths.base%/../../features/designs/move.feature'
      contexts: *contexts

    core:
      paths:
      - '%paths.base%/../../features/designs/view.feature'
      - '%paths.base%/../../features/designs/open-with.feature'
      - '%paths.base%/../../features/lifecycle.feature'
      contexts: *contexts

    projects:
      paths:
      - '%paths.base%/../../features/projects/create.feature'
      contexts: *contexts

    project-trash:
      paths:
      - '%paths.base%/../../features/projects/delete.feature'
      - '%paths.base%/../../features/projects/restore.feature'
      - '%paths.base%/../../features/projects/purge.feature'
      contexts: *contexts

    project-motion:
      paths:
      - '%paths.base%/../../features/projects/move.feature'
      contexts: *contexts

    project-copy:
      paths:
      - '%paths.base%/../../features/projects/copy.feature'
      - '%paths.base%/../../features/projects/rename.feature'
      contexts: *contexts

  formatters:
    # Human-readable progress in the log…
    pretty:
      verbose: true
    # …and machine-readable JUnit for the CI reporter.
    junit:
      output_path: '%paths.base%/junit'
